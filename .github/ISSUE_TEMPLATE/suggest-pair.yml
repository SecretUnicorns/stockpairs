name: Suggest a pair
description: Add a meme coin paired with a tokenized stock or crypto token to the board.
title: "Suggest pair: $"
labels: ["new pair"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep stockpairs complete. Pairs are reviewed by hand before they're listed, and we skip anything that looks like a rug.

        **Please don't include personal information** (your name, contact details, or personal wallet addresses). Token and pool contract addresses are all we need.

  - type: input
    id: symbol
    attributes:
      label: Token symbol
      description: The meme coin's ticker, without the `$`.
      placeholder: KNOTS
    validations:
      required: true

  - type: dropdown
    id: chain
    attributes:
      label: Chain
      options:
        - Solana
        - Robinhood Chain
        - Other (say which in the notes)
    validations:
      required: true

  - type: input
    id: token-address
    attributes:
      label: Token contract address
      description: Copy it from the explorer or DexScreener, not from a tweet. Copycat tokens reuse names.
    validations:
      required: true

  - type: input
    id: paired-symbol
    attributes:
      label: Paired with (symbol and name)
      description: What the pool trades the coin against.
      placeholder: SNAP — Snap
    validations:
      required: true

  - type: dropdown
    id: paired-kind
    attributes:
      label: What is the paired asset?
      options:
        - Tokenized stock (tracks a share price)
        - Bridged crypto (backed by a coin on another chain)
        - Crypto token (its own token, e.g. STONK)
        - Not sure
    validations:
      required: true

  - type: input
    id: paired-address
    attributes:
      label: Paired asset contract address
    validations:
      required: true

  - type: input
    id: pool
    attributes:
      label: DexScreener pool link
      placeholder: https://dexscreener.com/solana/...
    validations:
      required: true

  - type: textarea
    id: why-not-a-rug
    attributes:
      label: Why it isn't a rug
      description: Anything that helps us check it — pool age, liquidity, whether liquidity is locked or burned, holder spread, an active community.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else?

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I checked the contract addresses against an explorer or DexScreener.
          required: true
        - label: I'm not sharing personal information in this issue.
          required: true
        - label: I'm involved with this project (team, paid promoter, or large holder). Ticking this is fine; we just want to know.
